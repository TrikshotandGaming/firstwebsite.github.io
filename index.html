<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>HOW MUCH LONGER NOW?</title>

<link rel="icon" href="IMG_1932.png">
<link rel="apple-touch-icon" href="IMG_1932.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
}

body {
    font-family: "Determination Mono", monospace;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Bottom dialogue box */
#textbox {
    display: none;

    position: absolute;

    left: 32px;
    right: 32px;
    bottom: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

/* Typed dialogue */
#text {
    white-space: pre-wrap;
}

/* Center title text */
#centerText {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 64px;
    text-align: center;
    white-space: pre-line;
}
</style>
</head>

<body>

<div id="game">

    <!-- Bottom dialogue box -->
    <div id="textbox">
        <span id="text"></span>
    </div>

    <!-- Centered title -->
    <div id="centerText">
        DELTARUNE Chapter 6<br>
        2027
    </div>

</div>

<script>

/* Three possible dialogue messages */
const messages = [

`HOW MUCH LONGER NOW?

MY DELTARUNE.`,

`WHETHER 11 HOURS OR 11 YEARS,

DELTARUNE WILL BE WAITING.`,

`DELTARUNE

TOMORROW`

];

/* Pick one message randomly */
const message = messages[Math.floor(Math.random() * messages.length)];


/* Get page elements */
const textElement = document.getElementById("text");
const textbox = document.getElementById("textbox");


/*
   Create several copies of the sound ahead of time.
   This prevents Safari from having to create a new
   audio file every time a character is printed.
*/
const soundPool = [];

const soundCount = 8;

for (let i = 0; i < soundCount; i++) {

    const sound = new Audio("./snd_text.wav");

    sound.preload = "auto";

    soundPool.push(sound);
}


/* Keeps track of which sound copy to use */
let soundIndex = 0;


/* Play the text sound */
function playTextSound() {

    const sound = soundPool[soundIndex];

    sound.currentTime = 0;

    sound.play().catch(() => {});

    soundIndex++;

    if (soundIndex >= soundPool.length) {
        soundIndex = 0;
    }
}


/* Typing variables */
let i = 0;
let started = false;
let finishedTyping = false;


/* Type one character at a time */
function typeText() {

    if (i < message.length) {

        const character = message.charAt(i);

        /* Print the character */
        textElement.textContent += character;

        /* Play a sound for EVERY character */
        playTextSound();

        /* Move to the next character */
        i++;

        /* Typing speed */
        setTimeout(typeText, 35);

    } else {

        /* Text has finished printing */
        finishedTyping = true;
    }
}


/* Handle clicks */
document.addEventListener("click", function() {

    /* First click */
    if (!started) {

        started = true;

        /* Show the textbox */
        textbox.style.display = "block";

        /* Start typing */
        typeText();

        return;
    }


    /* After the text has completely finished */
    if (finishedTyping) {

        /* Hide the textbox */
        textbox.style.display = "none";
    }

});

</script>

</body>
</html>
