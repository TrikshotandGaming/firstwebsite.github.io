<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>HOW MUCH LONGER NOW?</title>

<link rel="icon" type="image/png" sizes="40x40" href="./tab-icon.png?v=2">
<link rel="apple-touch-icon" href="./tab-icon.png?v=2">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
}

body {
    font-family: "Determination Mono", monospace;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Bottom dialogue box */
#textbox {
    display: none;

    position: absolute;

    left: 32px;
    right: 32px;
    bottom: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

/* Typed dialogue */
#text {
    white-space: pre-wrap;
}

/* Center title text */
#centerText {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 64px;
    text-align: center;
    white-space: pre-line;
}

/* Countdown */
#countdown {
    font-size: 32px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div id="game">

    <!-- Bottom dialogue box -->
    <div id="textbox">
        <span id="text"></span>
    </div>

    <!-- Title -->
    <div id="centerText">
        DELTARUNE Chapter 6<br>
        <span id="year">2027</span>
        <div id="countdown"></div>
    </div>

</div>

<script>

/* Three dialogue messages */
const messages = [

`HOW MUCH LONGER NOW?

MY DELTARUNE.`,

`WHETHER 11 HOURS OR 11 YEARS,

DELTARUNE WILL BE WAITING.`,

`DELTARUNE

TOMORROW`

];


/* Randomizer */
const message = messages[Math.floor(Math.random() * messages.length)];


/* Get page elements */
const textElement = document.getElementById("text");
const textbox = document.getElementById("textbox");


/* Preloaded copies of the text sound */
const soundPool = [];

const soundCount = 8;

for (let i = 0; i < soundCount; i++) {

    const sound = new Audio("./snd_text.wav");

    sound.preload = "auto";

    soundPool.push(sound);
}


/* Keeps track of which sound copy to use */
let soundIndex = 0;


/* Play text sound */
function playTextSound() {

    const sound = soundPool[soundIndex];

    sound.currentTime = 0;

    sound.play().catch(() => {});

    soundIndex++;

    if (soundIndex >= soundPool.length) {
        soundIndex = 0;
    }
}


/* Typing variables */
let i = 0;
let started = false;
let finishedTyping = false;


/* Type one character at a time */
function typeText() {

    if (i < message.length) {

        const character = message.charAt(i);

        textElement.textContent += character;

        /* Play sound for every character */
        playTextSound();

        i++;

        /* Typing speed */
        setTimeout(typeText, 35);

    } else {

        finishedTyping = true;
    }
}


/* Handle clicks */
document.addEventListener("click", function() {

    /* First click */
    if (!started) {

        started = true;

        /* Show textbox */
        textbox.style.display = "block";

        /* Start typing */
        typeText();

        return;
    }


    /* After typing finishes */
    if (finishedTyping) {

        /* Hide textbox */
        textbox.style.display = "none";
    }

});


/* =========================
   COUNTDOWN TIMER
   ========================= */

const countdown = document.getElementById("countdown");

const targetDate = new Date("January 1, 2027 00:00:00");


function updateCountdown() {

    const now = new Date();

    const difference = targetDate - now;


    /* Countdown finished */
    if (difference <= 0) {

        countdown.textContent = "2027";

        return;
    }


    /* Calculate remaining time */

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );


    /* Display countdown */

    countdown.textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S`;
}


/* Start countdown */
updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
