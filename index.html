<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MY DELTARUNE.</title>

<link rel="icon" type="image/png" href="IMG_1932.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("DeterminationMono.ttf") format("truetype");
}

body {
    background: black;
    color: white;
    font-family: "Determination Mono", monospace;
    margin: 0;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

#textbox {
    position: absolute;
    left: 32px;
    right: 32px;
    bottom: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

#text {
    white-space: pre-wrap;
}

#continue {
    position: absolute;
    right: 18px;
    bottom: 10px;

    display: none;

    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="game">
    <div id="textbox">
        <span id="text"></span>
        <span id="continue">▼</span>
    </div>
</div>

<audio id="textSound" src="snd_text.wav" preload="auto"></audio>

<script>
const message =
`* HOW MUCH LONGER NOW?

* MY DELTARUNE.`;

const textElement = document.getElementById("text");
const continueArrow = document.getElementById("continue");
const textSound = document.getElementById("textSound");

let i = 0;

function typeText() {
    if (i < message.length) {

        const letter = message.charAt(i);
        textElement.textContent += letter;

        // Play the sound for EVERY character
        textSound.currentTime = 0;
        textSound.play().catch(() => {});

        i++;
        setTimeout(typeText, 35);

    } else {
        continueArrow.style.display = "block";
    }
}

// Start after one click so browsers allow audio playback
document.addEventListener("click", function startDialogue() {
    document.removeEventListener("click", startDialogue);
    typeText();
});
</script>

</body>
</html>
