<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>MY DELTARUNE.</title>

<link rel="icon" href="IMG_1932.png">
<link rel="apple-touch-icon" href="IMG_1932.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
}

body {
    font-family: "Determination Mono", monospace;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Top dialogue box */
#textbox {
    position: absolute;

    left: 32px;
    right: 32px;
    top: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

/* Typed dialogue */
#text {
    white-space: pre-wrap;
}

/* Continue arrow */
#continue {
    position: absolute;
    right: 18px;
    bottom: 10px;

    display: none;

    animation: blink 1s infinite;
}

/* Center text */
#centerText {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 64px;
    text-align: center;
    white-space: nowrap;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="textbox">
        <span id="text"></span>
        <span id="continue">▼</span>
    </div>

    <div id="centerText">
        DELTARUNE tomorrow
    </div>

</div>

<script>
const message =
`HOW MUCH LONGER NOW?

MY DELTARUNE.`;

const textElement = document.getElementById("text");
const continueArrow = document.getElementById("continue");

let i = 0;
let started = false;

function playTextSound() {
    const sound = new Audio("./snd_text.wav");
    sound.play().catch(() => {});
}

function typeText() {

    if (i < message.length) {

        const character = message.charAt(i);

        textElement.textContent += character;

        playTextSound();

        i++;

        setTimeout(typeText, 35);

    } else {

        continueArrow.style.display = "block";
    }
}

document.addEventListener("click", function startDialogue() {

    if (started) return;

    started = true;

    document.removeEventListener("click", startDialogue);

    typeText();
});
</script>

</body>
</html>
