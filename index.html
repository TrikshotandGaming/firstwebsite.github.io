<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>HOW MUCH LONGER NOW?</title>

<!-- Website icon -->
<link rel="icon" href="IMG_1932.png">
<link rel="apple-touch-icon" href="IMG_1932.png">

<style>
@font-face {
    font-family: "Determination Mono";
    src: url("./DeterminationMono.ttf") format("truetype");
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
}

body {
    font-family: "Determination Mono", monospace;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Bottom dialogue box */
#textbox {
    display: none;

    position: absolute;

    left: 32px;
    right: 32px;
    bottom: 32px;

    height: 180px;

    background: black;
    border: 8px solid white;

    box-sizing: border-box;
    padding: 24px;

    font-size: 32px;
    line-height: 1.4;
}

/* Typed dialogue */
#text {
    white-space: pre-wrap;
}

/* Center title text */
#centerText {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 64px;
    text-align: center;
    white-space: pre-line;
}

</style>
</head>

<body>

<div id="game">

    <!-- Bottom dialogue box -->
    <div id="textbox">
        <span id="text"></span>
    </div>

    <!-- Centered title -->
    <div id="centerText">
        DELTARUNE Chapter 6<br>
        2027
    </div>

</div>

<script>
const message =
`HOW MUCH LONGER NOW?

MY DELTARUNE.`;

const textElement = document.getElementById("text");
const textbox = document.getElementById("textbox");

let i = 0;
let started = false;
let finishedTyping = false;


/* Play the text sound */
function playTextSound() {
    const sound = new Audio("./snd_text.wav");
    sound.play().catch(() => {});
}


/* Type one character at a time */
function typeText() {

    if (i < message.length) {

        const character = message.charAt(i);

        textElement.textContent += character;

        /* Play sound for every character */
        playTextSound();

        i++;

        setTimeout(typeText, 35);

    } else {

        /* The text is completely finished */
        finishedTyping = true;
    }
}


/* Handle clicks */
document.addEventListener("click", function() {

    /* First click */
    if (!started) {

        started = true;

        /* Show the textbox */
        textbox.style.display = "block";

        /* Start typing */
        typeText();

        return;
    }


    /* Any later click after typing is finished */
    if (finishedTyping) {

        /* Hide the textbox */
        textbox.style.display = "none";
    }

});
</script>

</body>
</html>
